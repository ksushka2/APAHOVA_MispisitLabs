{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}IT-Школа{% endblock %} · {{ version }}</title>
    <link rel="stylesheet" href="{% static 'core/vendor/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'core/cabinet.css' %}">
</head>
<body>
    <a class="visually-hidden-focusable skip-link" href="#main">Перейти к содержанию</a>
    <header class="site-header">
        <div class="container site-shell">
            <div class="header-top">
                <a class="brand" href="{% url 'home' %}">IT-Школа</a>
                <span class="version-label">Версия {{ version }}</span>
            </div>
            <nav class="main-nav" aria-label="Основная навигация">
                <a href="{% url 'home' %}" {% if active_nav == 'home' %}aria-current="page"{% endif %}>Главная</a>
                <a href="{% url 'request_list' %}" {% if active_nav == 'list' %}aria-current="page"{% endif %}>Заявки</a>
                <a href="{% url 'request_create' %}" {% if active_nav == 'new' %}aria-current="page"{% endif %}>Новая заявка</a>
                <a href="{% url 'access_denied' %}" {% if active_nav == 'denied' %}aria-current="page"{% endif %}>Проверка отказа</a>
            </nav>
        </div>
    </header>
    <main id="main" class="container site-shell main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
