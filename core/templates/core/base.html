{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Педагог ДО{% endblock %} · {{ version }}</title>
    <link rel="stylesheet" href="{% static 'core/vendor/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'core/cabinet.css' %}">
</head>
<body>
    <a class="visually-hidden-focusable skip-link" href="#main">Перейти к содержанию</a>
    <header class="site-header">
        <div class="container site-shell d-flex flex-wrap justify-content-between align-items-center gap-3 py-3">
            <a class="brand d-flex align-items-center gap-2" href="{% url 'home' %}">
                <span class="brand-mark" aria-hidden="true">ДО</span>
                <span>Педагог ДО</span>
            </a>
            <span class="version-label">Версия {{ version }}</span>
        </div>
        <nav class="container site-shell nav nav-pills gap-1 pb-3" aria-label="Основная навигация">
            <a class="nav-link" href="{% url 'home' %}" {% if active_nav == 'home' %}aria-current="page"{% endif %}>Главная</a>
            <a class="nav-link" href="{% url 'request_list' %}" {% if active_nav == 'list' %}aria-current="page"{% endif %}>Заявки</a>
            <a class="nav-link" href="{% url 'request_create' %}" {% if active_nav == 'new' %}aria-current="page"{% endif %}>Новая заявка</a>
            <a class="nav-link" href="{% url 'access_denied' %}" {% if active_nav == 'denied' %}aria-current="page"{% endif %}>Проверка отказа</a>
        </nav>
    </header>
    <main id="main" class="container site-shell py-4 py-md-5">
        {% block content %}{% endblock %}
    </main>
    <footer class="container site-shell site-footer pb-4">Педагог ДО · Учебная версия</footer>
</body>
</html>
