<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ product_name }}</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 40rem;
            margin: 4rem auto;
            padding: 0 1rem;
            line-height: 1.6;
        }
        h1 { margin-bottom: 0.25rem; }
        p { margin: 0.5rem 0; }
        .muted { color: #555; }
    </style>
</head>
<body>
    <h1>{{ product_name }}</h1>
    <p>{{ description }}</p>
    <p>Версия {{ version }}</p>
    <p class="muted">Разработка продолжается</p>
</body>
</html>
