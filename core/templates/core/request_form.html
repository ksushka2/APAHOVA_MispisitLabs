{% extends "core/base.html" %}
{% block title %}Новая заявка{% endblock %}
{% block content %}
<p class="eyebrow mb-2">Методическая поддержка</p>
<h1 class="mb-2">Новая заявка</h1>
<p class="text-secondary mb-4">Заполните все поля. У каждой программы свой минимальный стаж.</p>
<form class="card p-4 p-md-5 form-panel" method="post" action="{% url 'request_create' %}">
    {% csrf_token %}
    <div class="row g-3">
        {% for field in form %}
        <div class="{% if field.name == 'program' %}col-12{% else %}col-md-6{% endif %}">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
    </div>
    <div class="d-flex flex-wrap gap-2 mt-4">
        <button class="btn btn-primary" type="submit">Отправить заявку</button>
        <a class="btn btn-outline-primary" href="{% url 'request_list' %}">К реестру</a>
    </div>
</form>
{% endblock %}
