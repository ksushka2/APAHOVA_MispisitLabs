name: mispisit-apahova

services:
  app:
    image: ksushkaap/mispisit-lab1:0.0.5
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/notifications/', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s
  worker:
    image: ksushkaap/mispisit-lab1:0.0.5
    command: ["python", "manage.py", "process_notifications"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      app:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - maildata:/data
volumes:
  dbdata:
  maildata:
